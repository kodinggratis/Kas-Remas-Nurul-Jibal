<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KAS Reamaja - Reamas Nurul Jibal</title> 
    <link rel="icon" type="image/png" href="logo.png"> 
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
        }
        .app-container {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            margin-top: 15px;
            color: #555;
            font-size: 16px;
        }
        .fallback-message {
            display: none;
            padding: 20px;
            text-align: center;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            max-width: 400px;
            margin: 100px auto;
            position: relative;
            z-index: 10;
        }
        .btn-link {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-top: 15px;
            font-weight: bold;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="loading" class="loading-screen">
        <div class="spinner"></div>
        <div class="loading-text">Memuat Aplikasi...</div>
    </div>

    <div id="fallback" class="fallback-message">
        <h3>Gagal Memuat Aplikasi</h3>
        <p>Browser Anda memblokir aplikasi eksternal atau koneksi terputus.</p>
        <a href="https://google.com" target="_blank" class="btn-link">Buka Langsung Aplikasi</a>
    </div>

    <iframe 
        id="app-frame"
        class="app-container" 
        src="https://script.google.com/macros/s/AKfycbxDTwL7LrM3tBlh1z7HKPDfGVQ5y4UwuiKmd5AMeb4Itrtw0KzzFm3qQLEGGwlW95Wc5A/exec" 
        allow="geolocation; microphone; camera; midi; encrypted-media;"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
        onload="hilangkanLoading()">
    </iframe>

    <script>
        function hilangkanLoading() {
            const loadingScreen = document.getElementById('loading');
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
                loadingScreen.style.display = 'none';
            }, 500);
        }

        setTimeout(() => {
            const loadingScreen = document.getElementById('loading');
            if (loadingScreen.style.display !== 'none') {
                loadingScreen.style.display = 'none';
                document.getElementById('fallback').style.display = 'block';
            }
        }, 8000);
    </script>
</body>
</html>
